name: Tests
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'docs/**', 'release/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check simulation.js
          node --check renderer.js
          node --check game.js
          node --check main.cjs
          node --check build.cjs
      - name: Run game tests
        run: npm test
